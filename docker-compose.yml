include:
  - ${PWD}/compose-extensions/networks-volumes.yml

volumes:
  mongodb_data:
    external: false
  jobs_docker_data:
    external: false

x-extends: &service-extends
  extends:
    file: ${PWD}/compose-extensions/compose-base-service.yml
    service: service-common

services:
  messageq:
    <<: *service-extends
    image: rabbitmq:3
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
  database:
    <<: *service-extends
    image: mongo:4.0
    restart: always
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - "mongodb_data:/data/db"
    command: "mongod --smallfiles --logpath=/dev/null"
    ports:
      - "27017"
  frontend:
    <<: *service-extends
    image: annotator_frontend
    build:
      dockerfile: ./Dockerfile.frontend
      target: production  # Default since production is the last stage
    ports:
      - "8080:8080"
    environment:
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS}
    depends_on:
      - webserver
    networks:
      adumbra_jobs_network:
        aliases:
          - frontend
  webserver:
    <<: *service-extends
    build:
      dockerfile: ./Dockerfile.backend
      target: webserver
    image: webserver
    restart: always
    ports:
      - "5001"
    environment:
      - FLASK__SECRET_KEY=RandomSecretKeyHere
      - FILE_WATCHER=true
      - NAME=Test Annotator
    depends_on:
      - database
      - workers
  workers:
    <<: *service-extends
    image: annotator_workers
    build:
      dockerfile: ./Dockerfile.backend
      target: workers
    depends_on:
      - messageq
      - database
    networks:
      adumbra_jobs_network:
        aliases:
          - workers
  jobs:
    <<: *service-extends
    image: jobs
    build:
      dockerfile: ./Dockerfile.backend
      target: jobs
    networks:
      adumbra_jobs_network:
        aliases:
          - jobs
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
      - DOCKER_BUILDKIT=0
    volumes:
      - jobs_docker_data:/var/lib/docker
  ia-gpu:
    extends:
      file: ${PWD}/compose-extensions/ia-gpu.yml
      service: ia
    profiles:
      - ia-gpu
    networks:
      adumbra_network:
        aliases:
          - ia
  ia-cpu:
    extends:
      file: ${PWD}/compose-extensions/ia-cpu.yml
      service: ia
    profiles:
      - ia-cpu
    networks:
      adumbra_network:
        aliases:
          - ia
